name: Ranking Fiona Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch index.html
        run: python3 .github/scripts/patch_rankfiona.py
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Keine Aenderung."
          else
            git add index.html
            git commit -m "fix: Ranking - Fiona ausserhalb Top 15 mit Detail anzeigen"
            git push
          fi
